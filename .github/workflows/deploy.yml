name: deploy

# Section 12.2 and Section 1021 (Task T2.2)
# Hardened container build and deployment with OIDC authentication
# No long-lived cloud keys (threat #4). Pinned Action SHAs (threat #6).
# FLAGGED FOR HUMAN REVIEW per AGENTS.md rules on editing .github/workflows/

on:
  push:
    branches:
      - main
    paths:
      - "src/footfall/server/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-serving
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Container & Deploy via OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serving  # Protected environment for production serving
    permissions:
      contents: read
      id-token: write     # Required for OIDC authentication
      packages: write     # For publishing to GitHub Container Registry (ghcr.io)
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push container image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
