[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "footfall-core"
version = "0.1.0"
description = "Real usage, not hype. Validated adoption signals for AI developer tools."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "IBADAT ALI", email = "ibadcodes@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "ai-tools", "adoption", "analytics", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "duckdb>=1.0.0",
  "pyarrow>=16.0.0",
  "scikit-learn>=1.5.0",
  "mcp>=1.0.0",
  "click>=8.1.0",
  "pyyaml>=6.0.1",
  "tenacity>=8.3.0",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "types-pyyaml>=6.0.12",
]
phase0 = [
  "jupyter>=1.0.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
  "matplotlib>=3.9.0",
  "ruptures>=1.1.9",
  "google-cloud-bigquery>=3.23.0",
]

[project.scripts]
footfall = "footfall.cli:main"

[project.urls]
Homepage = "https://github.com/Ibadat-Ali86/footfall"
Repository = "https://github.com/Ibadat-Ali86/footfall"
"Bug Tracker" = "https://github.com/Ibadat-Ali86/footfall/issues"
Documentation = "https://github.com/Ibadat-Ali86/footfall/blob/main/docs/BUILD.md"

[tool.hatch.build.targets.wheel]
packages = ["src/footfall"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "UP",       # pyupgrade
  "S",        # flake8-bandit (security)
  "A",        # flake8-builtins
  "PT",       # flake8-pytest-style
  "SIM",      # flake8-simplify
  "TCH",      # flake8-type-checking
  "ANN",      # flake8-annotations
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "TC002", "TC003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
files = ["src/footfall"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-q",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "unit: pure unit tests, no I/O",
  "contract: recorded HTTP fixture tests",
  "security: security-focused tests",
  "golden: output regression tests",
]

[tool.coverage.run]
branch = true
source = ["src/footfall"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
