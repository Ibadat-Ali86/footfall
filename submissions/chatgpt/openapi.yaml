openapi: 3.1.0
info:
  title: Footfall Developer Adoption Analytics
  description: Empirical developer adoption analytics for AI tools. Compares real package downloads with GitHub star momentum. Results are empirical measurements and do not constitute financial, investment, or purchasing advice.
  version: 1.0.0
  contact:
    name: Footfall Support
    url: https://footfall.dev
    email: support@footfall.dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://mcp.footfall.dev
    description: Production Footfall Server

paths:
  /health/live:
    get:
      summary: Liveness check probe
      operationId: checkLiveness
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: live

  /health/ready:
    get:
      summary: Readiness check probe
      operationId: checkReadiness
      responses:
        '200':
          description: Service is ready to serve
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  as_of:
                    type: string
                    example: '2026-11-02'
                  method_version:
                    type: string
                    example: m1.0
        '503':
          description: Service unavailable or disabled via kill switch

  /api/v1/compare:
    post:
      summary: Compare 2 to 6 AI developer tools
      description: Compares real production adoption velocity versus social attention across 2 to 6 named AI tools.
      operationId: compareTools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
      responses:
        '200':
          description: Successful comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
        '400':
          description: Invalid input or boundary violation
        '403':
          description: Origin forbidden
        '429':
          description: Rate limit exceeded
        '503':
          description: Data unavailable

  /api/v1/trend:
    post:
      summary: Historical adoption trend for a tool
      description: Retrieves weekly time-series metrics (downloads, stars, attention) for a single tool over 4 to 104 weeks.
      operationId: getToolTrend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendRequest'
      responses:
        '200':
          description: Successful trend result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
        '400':
          description: Invalid input
        '429':
          description: Rate limit exceeded

  /api/v1/find-rising:
    post:
      summary: Find rising AI developer tools
      description: Lists accelerating AI tools filtered by ecosystem category and lifecycle phase.
      operationId: findRisingTools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRisingRequest'
      responses:
        '200':
          description: Successful search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindRisingResponse'
        '429':
          description: Rate limit exceeded

components:
  schemas:
    CompareRequest:
      type: object
      required:
        - entities
      properties:
        entities:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            pattern: '^[A-Za-z0-9@._/\-]{1,100}$'
            description: Canonical ID, GitHub repository (owner/repo), or package name.
        window_weeks:
          type: integer
          minimum: 4
          maximum: 52
          default: 12
      additionalProperties: false

    CompareResponse:
      type: object
      properties:
        as_of:
          type: string
          example: '2026-11-02'
        method_version:
          type: string
          example: m1.0
        rows:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              display_name:
                type: string
              phase:
                type: string
              adoption_z:
                type: number
              attention_z:
                type: number
              divergence:
                type: number
              confidence:
                type: string
        caveats:
          type: array
          items:
            type: string

    TrendRequest:
      type: object
      required:
        - entity
      properties:
        entity:
          type: string
          pattern: '^[A-Za-z0-9@._/\-]{1,100}$'
        metrics:
          type: array
          items:
            type: string
            enum: [downloads, stars, attention]
        window_weeks:
          type: integer
          minimum: 4
          maximum: 104
          default: 26
      additionalProperties: false

    TrendResponse:
      type: object
      properties:
        entity_id:
          type: string
        as_of:
          type: string
        method_version:
          type: string
        series:
          type: array
          items:
            type: object
            properties:
              week:
                type: string
              downloads:
                type: number
              stars:
                type: number
              attention:
                type: number

    FindRisingRequest:
      type: object
      properties:
        category:
          type: string
          default: any
        phase:
          type: string
          enum: [insufficient_data, breakout, attention_ahead, use_ahead, fading, emerging, mainstream, plateau]
          default: breakout
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        min_weekly_downloads:
          type: number
          default: 500.0
      additionalProperties: false

    FindRisingResponse:
      type: object
      properties:
        as_of:
          type: string
        method_version:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              display_name:
                type: string
              phase:
                type: string
              adoption_z:
                type: number
              divergence:
                type: number
              confidence:
                type: string
